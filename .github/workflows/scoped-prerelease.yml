name: Scoped Pre-release Build

on:
  push:
    branches:
      - security-hardening-2026-11
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoped-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped-prerelease:
    name: Test and build scopedRelease APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4

      - name: Verify no third-party keys
        run: bash scripts/verify-no-keys.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install platform-tools

          CANDIDATE="$( "$SDKMANAGER" --list 2>/dev/null \
            | sed -n 's/^[[:space:]]*platforms;android-\([0-9][0-9.]*\).*/\1/p' \
            | grep -v -E '(beta|rc|dev)' \
            | sort -Vr | head -n1 || true )"
          PLATFORM=""
          if [ -n "$CANDIDATE" ]; then
            if "$SDKMANAGER" --install "platforms;android-$CANDIDATE"; then
              PLATFORM="$CANDIDATE"
            fi
          fi
          if [ -z "$PLATFORM" ]; then
            for candidate in 37 36 35; do
              if "$SDKMANAGER" --install "platforms;android-$candidate"; then
                PLATFORM="$candidate"
                break
              fi
            done
          fi
          if [ -z "$PLATFORM" ]; then
            echo "::error::Could not install an Android platform SDK"
            exit 1
          fi

          MAJOR="$(echo "$PLATFORM" | cut -d. -f1)"
          echo "COMPILE_SDK=$PLATFORM" >> "$GITHUB_OUTPUT"
          if [ "$MAJOR" -lt 37 ]; then
            for file in app/build.gradle.kts app-ui/build.gradle.kts core-data/build.gradle.kts core-geo/build.gradle.kts service/build.gradle.kts xposed/build.gradle.kts; do
              [ ! -f "$file" ] || sed -i "s/compileSdk = 37/compileSdk = $MAJOR/g" "$file"
            done
            echo "::warning::CI SDK fallback changed compileSdk to $MAJOR for this runner only"
          fi

          BUILD_TOOLS="$( "$SDKMANAGER" --list 2>/dev/null \
            | sed -n 's/^[[:space:]]*build-tools;\([0-9][0-9.]*\).*/\1/p' \
            | grep -v -E '(rc|beta|pre)' | sort -V | tail -n1 || true )"
          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::Could not determine Android build-tools version"
            exit 1
          fi
          "$SDKMANAGER" --install "build-tools;$BUILD_TOOLS"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Using Android platform $PLATFORM and build-tools $BUILD_TOOLS"

      - name: Run core-geo unit tests
        run: ./gradlew --no-daemon :core-geo:test

      - name: Run core-data unit tests
        run: ./gradlew --no-daemon :core-data:test

      - name: Run Xposed unit tests
        run: ./gradlew --no-daemon :xposed:test

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-prerelease-test-reports
          path: |
            core-geo/build/reports/tests/test
            core-geo/build/test-results/test
            core-data/build/reports/tests
            core-data/build/test-results
            xposed/build/reports/tests/test
            xposed/build/test-results/test
          if-no-files-found: warn
          retention-days: 14

      - name: Verify release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more release signing secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

      - name: Decode release keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/location-sp-release.jks"
          test -s "$RUNNER_TEMP/location-sp-release.jks"

      - name: Build scopedRelease only
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/location-sp-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleScopedRelease

      - name: Collect and verify scoped APKs
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/scoped/release"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Expected scoped release output directory was not created: $APK_DIR"
            exit 1
          fi

          FOUND=0
          while IFS= read -r -d '' apk; do
            name="$(basename "$apk")"
            if [[ "$name" == *"arm64-v8a"* ]]; then
              abi="arm64-v8a"
            elif [[ "$name" == *"armeabi-v7a"* ]]; then
              abi="armeabi-v7a"
            else
              echo "::error::Unexpected APK ABI/name: $name"
              exit 1
            fi

            target="$DIST_DIR/LocationSp_Next-scoped-$abi.apk"
            cp "$apk" "$target"
            "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$target"
            FOUND=$((FOUND + 1))
          done < <(find "$APK_DIR" -type f -name '*.apk' -print0)

          if [ "$FOUND" -ne 2 ] || [ ! -s "$DIST_DIR/LocationSp_Next-scoped-arm64-v8a.apk" ] || [ ! -s "$DIST_DIR/LocationSp_Next-scoped-armeabi-v7a.apk" ]; then
            echo "::error::Expected exactly two scoped APKs (arm64-v8a and armeabi-v7a); found $FOUND"
            exit 1
          fi

          VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | head -n1 | cut -d= -f2-)"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          TAG="scoped-prerelease-$GITHUB_RUN_NUMBER-$SHORT_SHA"
          cp "$DIST_DIR/LocationSp_Next-scoped-arm64-v8a.apk" "$DIST_DIR/LocationSp_Next-scoped-arm64-v8a-$TAG.apk"
          cp "$DIST_DIR/LocationSp_Next-scoped-armeabi-v7a.apk" "$DIST_DIR/LocationSp_Next-scoped-armeabi-v7a-$TAG.apk"
          rm "$DIST_DIR/LocationSp_Next-scoped-arm64-v8a.apk" "$DIST_DIR/LocationSp_Next-scoped-armeabi-v7a.apk"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$DIST_DIR"

      - name: Upload scoped pre-release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSp_Next-scoped-prerelease
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Pre-release (scoped only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LocationSp_Next Scoped Pre-release ${{ steps.package.outputs.version }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Automated **scoped-only pre-release** from branch `security-hardening-2026-11`.

            - Build variant: `scopedRelease` (Release build type; non-Global scheme)
            - Signing: repository release keystore
            - Source commit: ${{ github.sha }}
            - Included ABIs: `arm64-v8a`, `armeabi-v7a`
            - Global variant: **not built and not included**

            Unit-test gates: `:core-geo:test`, `:core-data:test`, `:xposed:test`.

            This is a pre-release for validation, not a stable release.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
