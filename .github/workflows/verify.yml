name: Verify Android builds and unit tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        run: |
          set -eu
          test -x ./gradlew || chmod +x ./gradlew
          ./gradlew --version
      - name: Run unit tests and build both schemes
        run: |
          ./gradlew --no-daemon --stacktrace \
            testScopedDebugUnitTest \
            testGlobalDebugUnitTest \
            :app:assembleScopedDebug \
            :app:assembleGlobalDebug
