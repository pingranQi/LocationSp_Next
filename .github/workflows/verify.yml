name: Verify Android builds and unit tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - "audit/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

# Push and pull_request events can target the same commit. Keep only the newest
# verification run for a branch to avoid wasting runners on superseded commits.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        run: |
          set -eu
          test -x ./gradlew || chmod +x ./gradlew
          ./gradlew --version
      - name: Run scoped unit tests and build
        run: |
          # Keep scheme KSP/Room schema generation in separate Gradle invocations.
          ./gradlew --no-daemon --stacktrace \
            testScopedDebugUnitTest \
            :app:assembleScopedDebug
      - name: Run global unit tests and build
        run: |
          ./gradlew --no-daemon --stacktrace \
            testGlobalDebugUnitTest \
            :app:assembleGlobalDebug

      - name: Upload Room schema snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: room-schema-snapshots
          path: core-data/schemas/
          if-no-files-found: warn
          retention-days: 14
