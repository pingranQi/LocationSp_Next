name: Generate Keystore (one-off)
on:
  workflow_dispatch:
    inputs:
      password:
        description: 'keystore 密码（同时作为 key 密码）'
        required: true
      alias:
        description: 'key alias（仅允许字母、数字、点、下划线和连字符）'
        required: false
        default: 'locationspnext'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ inputs.password }}
          KEY_ALIAS: ${{ inputs.alias }}
        run: |
          set -eu
          : "${KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${KEY_ALIAS:?Missing key alias}"
          case "$KEY_ALIAS" in
            *[!a-zA-Z0-9._-]*)
              echo "::error::Invalid key alias"
              exit 1
              ;;
          esac
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore.jks" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD \
            -dname "CN=LocationSp_Next, OU=Android, O=ZenQing-Tao, C=CN"
          keytool -list -v -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass:env KEYSTORE_PASSWORD | grep -E "SHA1|SHA256"
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: ${{ runner.temp }}/keystore.jks
          retention-days: 1
